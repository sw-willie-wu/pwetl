# Database Sink - Streaming 模式
# 持續監聽 sales_data.csv 所在目錄，有變更時自動寫入資料庫
# 搭配 columns 自動建表

sources:
  - name: sales
    type: file
    path: sales_data.csv
    format: csv
    mode: streaming
    schema:
      order_id: int
      product_id: str
      product_name: str
      category: str
      quantity: int
      unit_price: float
      order_date: str

transform: transform.SalesTransform

sinks:
  - name: db_output
    type: database
    dsn: postgresql://${DB_USER:pwetl}:${DB_PASSWORD:pwetl_pass}@${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:pwetl_demo}
    table: sales_summary_v2
    columns:
      id: uuid, pk
      product_id: text
      product_name: text
      category: text
      total_sold: bigint
      revenue: float
      avg_price: float
      time: timestamptz            # Collides with Pathway metadata, sink handles it

  - name: output_csv
    type: file
    path: output/sales_summary.csv
    format: csv
