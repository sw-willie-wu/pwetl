# Database Sink - init_sql 模式
# 透過 init_sql 執行自訂 DDL（CREATE TABLE + INDEX 等）
# 適合需要進階 DDL 控制的場景（columns 無法滿足時）
#
# 注意：init.sql 是給 Docker entrypoint 用的
#       sink_init.sql 才是給 pwetl init_sql 用的（建不同的 table + index）

sources:
  - name: sales
    type: file
    path: sales_data.csv
    format: csv
    mode: static
    schema:
      order_id: int
      product_id: str
      product_name: str
      category: str
      quantity: int
      unit_price: float
      order_date: str

transform: transform.SalesTransform

sinks:
  - name: db_output
    type: database
    dsn: postgresql://${DB_USER:pwetl}:${DB_PASSWORD:pwetl_pass}@${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:pwetl_demo}
    table: sales_summary_v3
    init_sql: sink_init.sql       # 執行自訂 DDL（CREATE TABLE + INDEX）

  - name: output_csv
    type: file
    path: output/sales_summary.csv
    format: csv
