sources:
  - name: sensors
    type: file
    path: sensor_data.csv
    format: csv
    schema:
      sensor_id: str
      location: str
      temperature: float
      humidity: float
      timestamp: str

transform: transform.SensorTransform

sinks:
  - name: api_json
    type: api
    url: ${API_URL}
    method: POST
    format: json
    batch_size: 0  # Send all records at once
    headers:
      Content-Type: application/json
    timeout: 30
    max_retry: 3
    retry_delay: 1

  - name: api_form
    type: api
    url: ${API_URL}
    method: POST
    format: form
    batch_size: 1  # Send one record per request
    timeout: 30
    max_retry: 3
    retry_delay: 1
