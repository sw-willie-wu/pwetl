# YouBike 2.0 即時站點資訊 API 範例
# 從台北市公共自行車 API 讀取即時資料，並輸出為多種格式

sources:
  - name: youbike
    type: api
    url: ${YOUBIKE_API_URL}
    method: GET
    timeout: 30
    mode: static  # 執行一次
    validation_mode: strict  # none: 略過驗證, sample: 警告, strict: 強制驗證
    schema:
      sno: str
      sna: str
      sarea: str
      mday: str
      ar: str
      sareaen: str
      snaen: str
      aren: str
      act: str
      srcUpdateTime: datetime
      updateTime: datetime
      infoTime: datetime
      infoDate: str
      Quantity: int
      available_rent_bikes: int
      available_return_bikes: int
      latitude: float
      longitude: float

transform: transform.YouBikeTransform

sinks:
  - name: output_csv
    type: csv
    path: youbike_output.csv
  
  - name: output_json
    type: json
    path: youbike_output.json
  
  - name: output_jsonl
    type: jsonl
    path: youbike_output.jsonl
